try{var _s=JSON.parse(localStorage.getItem("ledger.settings")||"{}"),_d=new Date(),_t=_d.getFullYear()+"-"+(_d.getMonth()+1)+"-"+_d.getDate(),_m=_s.splash||"daily";
if(_m==="always"||(_m==="daily"&&_s.lastSplashDay!==_t))document.documentElement.setAttribute("data-splash","1");
if(_s.lock&&_s.lock.on)document.documentElement.setAttribute("data-locked","1");
if(_s.hideOnOpen)document.documentElement.setAttribute("data-hide","1");}catch(e){}

<style>

@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF}
@font-face{font-family:"IBM Plex Sans Arabic";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF}
@font-face{font-family:"Readex Pro";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/readex-pro-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Readex Pro";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/readex-pro-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF}
[hidden]{display:none!important}
body{margin:0;font-size:15px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: app shell — dark navy sidebar on the right (RTL) with the main "new job" action; content area with views (home, jobs, clients, payments);
   phone: top bar + bottom tab bar with a center add button. Add/edit = 3-step wizard; details = side sheet (bottom sheet on phone). */
:root{
  --paper:#F3F5F8; --card:#FFFFFF; --ink:#132030; --muted:#5E6C7C; --line:#E0E5EB; --soft:#F7F9FB;
  --side:#0F1C2B; --side-ink:#DCE6F0; --side-muted:#8193A6; --side-hi:#1B2D41;
  --accent:#0C7FA3; --accent-ink:#FFFFFF; --accent-soft:#E3F2F7;
  --owed:#C2186E; --owed-soft:#FBE6F0;
  --ok:#1D7A47; --ok-soft:#E2F3E9; --warn:#9A5800; --warn-soft:#FCEFD9; --bad:#B42335; --bad-soft:#FBE4E7;
  --cyan:#00A3D9; --magenta:#D6187E; --yellow:#F2C200; --key:#1A1A1A;
  --shadow:0 1px 2px rgba(16,28,43,.05),0 4px 16px rgba(16,28,43,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E141B; --card:#161F29; --ink:#E7EDF3; --muted:#94A3B3; --line:#26323F; --soft:#1B2632;
  --side:#0A1119; --side-ink:#DCE6F0; --side-muted:#7F90A2; --side-hi:#172433;
  --accent:#4CB8DA; --accent-ink:#04212B; --accent-soft:#12303D;
  --owed:#F06BA8; --owed-soft:#3A1729;
  --ok:#5DCB8C; --ok-soft:#14301F; --warn:#F0AA4C; --warn-soft:#382811; --bad:#F27887; --bad-soft:#3B1A20;
  --key:#E7EDF3; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E141B; --card:#161F29; --ink:#E7EDF3; --muted:#94A3B3; --line:#26323F; --soft:#1B2632;
  --side:#0A1119; --side-ink:#DCE6F0; --side-muted:#7F90A2; --side-hi:#172433;
  --accent:#4CB8DA; --accent-ink:#04212B; --accent-soft:#12303D;
  --owed:#F06BA8; --owed-soft:#3A1729;
  --ok:#5DCB8C; --ok-soft:#14301F; --warn:#F0AA4C; --warn-soft:#382811; --bad:#F27887; --bad-soft:#3B1A20;
  --key:#E7EDF3; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:22px;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding-inline:6px}
.brand svg{width:32px;height:30px;flex:none;color:#F3F6FA}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:600;display:block;line-height:1.2}
.brand small{color:var(--side-muted);font-size:.76rem}
.cmyk{display:flex;gap:3px;margin-top:4px}
.cmyk i{width:7px;height:7px;border-radius:50%}
.side .new{width:100%;justify-content:center;padding:11px;font-size:1rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--side-muted);padding:10px 12px;border-radius:8px;font-weight:500;text-align:start}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{color:var(--side-ink);background:var(--side-hi)}
.nav button[aria-current="page"]{color:var(--side-ink);background:var(--side-hi)}
.nav button[aria-current="page"] svg{color:var(--cyan)}
.nav .badge{margin-inline-start:auto;font-size:.72rem;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;line-height:1.6}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--side-muted);padding-inline:6px}
.side-foot select{background:var(--side-hi);color:var(--side-ink);border:1px solid var(--side-hi);border-radius:6px;padding:4px 8px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:22px 6px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px}
.topbar h1{font-size:1.5rem;font-weight:600;margin-inline-end:auto}
.topbar .sub{display:block;font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:400}
.content{padding-block:16px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;display:flex;flex-direction:column;gap:20px}
.mbar,.tabbar{display:none}

.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}

.notice{padding:10px 14px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}

/* ---------- home ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.kpi .lbl{color:var(--muted);font-size:.84rem;display:flex;align-items:center;gap:6px}
.kpi .lbl i{width:8px;height:8px;border-radius:2px;flex:none}
.kpi .val{font-family:var(--f-display);font-size:1.7rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.kpi .val small{font-size:.8rem;color:var(--muted);font-family:var(--f-body);font-weight:500;margin-inline-start:4px}
.kpi .foot{font-size:.8rem;color:var(--muted)}
.kpi.owed .val{color:var(--owed)}
.kpi.late .val.has{color:var(--bad)}
.panels{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:1rem;font-weight:600;margin-inline-end:auto}
.plist{list-style:none;margin:0;padding:6px}
.plist li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer;min-width:0}
.plist li:hover{background:var(--soft)}
.plist .grow{flex:1;min-width:0}
.plist .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .amt{font-weight:600;color:var(--owed);white-space:nowrap}
.pempty{padding:26px 18px;text-align:center;color:var(--muted);font-size:.9rem}
.datebox{width:46px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;line-height:1.15}
.datebox b{display:block;font-family:var(--f-display);font-size:1.05rem;padding-top:4px}
.datebox span{display:block;font-size:.68rem;color:var(--muted);padding-bottom:4px}
.datebox.late{border-color:var(--bad)}
.datebox.late b{color:var(--bad)}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:.9rem;background:var(--accent-soft);color:var(--accent)}

/* ---------- badges ---------- */
.pill{font-size:.78rem;border-radius:999px;padding:2px 10px;white-space:nowrap;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-new{background:var(--accent-soft);color:var(--accent)}
.st-work{background:var(--warn-soft);color:var(--warn)}
.st-review{background:var(--owed-soft);color:var(--owed)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-cancel{background:var(--soft);color:var(--muted)}
.cd{font-size:.78rem;font-weight:600;border-radius:6px;padding:1px 8px;white-space:nowrap}
.c-late{background:var(--bad-soft);color:var(--bad)}
.c-soon{background:var(--warn-soft);color:var(--warn)}
.c-ok{background:var(--soft);color:var(--muted)}
.c-done{background:var(--ok-soft);color:var(--ok)}
.ex{font-size:.68rem;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 6px;margin-inline-start:6px;vertical-align:middle;font-weight:500}

/* ---------- jobs ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:500;white-space:nowrap;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.seg button b{font-weight:600;margin-inline-start:4px;font-size:.8rem;opacity:.8}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}

.jtable{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.jhead,.jrow{display:grid;grid-template-columns:minmax(0,2.2fr) 130px 150px minmax(0,1.3fr) 110px 28px;gap:14px;align-items:center;padding:12px 18px}
.jhead{font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--line);background:var(--soft)}
.jrow{border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;text-align:start}
.jrow:last-child{border-bottom:0}
.jrow:hover{background:var(--soft)}
.jrow.is-late{box-shadow:inset -3px 0 0 var(--bad)}
.jt{min-width:0}
.jt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jt span{font-size:.83rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jdue{display:flex;flex-direction:column;gap:2px;align-items:flex-start;font-size:.86rem}
.jmoney{min-width:0;font-size:.82rem;color:var(--muted)}
.meter{height:6px;border-radius:999px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.full i{background:var(--ok)}
.jrem{font-weight:600;font-size:.92rem}
.jrem.has{color:var(--owed)} .jrem.zero{color:var(--ok)}
.chev{color:var(--muted);width:18px;height:18px}
.lbl-m{display:none}

.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);background:var(--card)}
.empty h2{font-size:1.15rem;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 0 14px}
.exbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:10px;font-size:.88rem}
.exbar span{flex:1;min-width:200px}

/* ---------- clients ---------- */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.ccard .top{display:flex;gap:10px;align-items:center;min-width:0}
.ccard .top div{min-width:0}
.ccard .top b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .top span{font-size:.82rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--soft);border-radius:9px;padding:10px}
.stats span{display:block;font-size:.72rem;color:var(--muted)}
.stats b{font-size:.92rem}
.ccard .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- payments ---------- */
.month{display:flex;flex-direction:column;gap:0}
.month-h{display:flex;align-items:baseline;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.month-h h2{font-size:1rem;margin-inline-end:auto}
.month-h b{color:var(--ok);font-size:1rem}
.prow{display:flex;gap:12px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--soft)}
.prow .grow{flex:1;min-width:0}
.prow .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.prow .grow span{font-size:.8rem;color:var(--muted)}
.prow .a{font-weight:600;color:var(--ok);white-space:nowrap}

/* ---------- dialogs ---------- */
dialog{border:0;background:var(--card);color:var(--ink);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(8,14,22,.55)}
dialog.wizard{border-radius:16px;width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog.sheet{margin:0;inset:0 auto 0 0;height:100%;max-height:100%;width:min(480px,100vw);border-radius:0}
.wz{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.wz-h{padding:20px 22px 0;display:flex;flex-direction:column;gap:14px}
.wz-h .row{display:flex;align-items:center;gap:8px}
.wz-h h2{font-size:1.2rem;margin-inline-end:auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;list-style:none;margin:0;padding:0}
.steps button{width:100%;border:0;background:none;padding:0;text-align:start;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.84rem;font-weight:500}
.steps button::before{content:"";height:4px;border-radius:4px;background:var(--line)}
.steps button.done::before,.steps button.on::before{background:var(--accent)}
.steps button.on{color:var(--ink)}
.steps button[disabled]{cursor:default}
.wz-b{padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.wz-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.wz-f .sp{margin-inline-end:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.86rem;color:var(--muted);min-width:0;font-weight:500}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:10px 12px;color:var(--ink);width:100%;min-width:0;font-weight:400}
label.f input:focus,label.f textarea:focus{border-color:var(--accent);outline:none;background:var(--card)}
label.f textarea{min-height:80px;resize:vertical}
label.f.err input{border-color:var(--bad)}
.req{color:var(--bad)}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.pick{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:.88rem;color:var(--ink)}
.pick:hover{border-color:var(--accent)}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.flabel{font-size:.86rem;color:var(--muted);font-weight:500;margin-bottom:6px;display:block}
.recap{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:.88rem;display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
.recap span{color:var(--muted)}
.money-in{position:relative}
.money-in em{position:absolute;inset-inline-end:12px;bottom:10px;font-style:normal;color:var(--muted);font-size:.85rem;pointer-events:none}

.sh{display:flex;flex-direction:column;height:100%}
.sh-h{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sh-h .row{display:flex;gap:10px;align-items:flex-start}
.sh-h h2{font-size:1.25rem;flex:1;min-width:0;overflow-wrap:anywhere}
.sh-h .who{color:var(--muted);font-size:.9rem}
.sh-b{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:18px}
.sh-f{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sh-f .sp{margin-inline-end:auto}
.blk h3{font-size:.92rem;font-weight:600;margin-bottom:8px;font-family:var(--f-body)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mgrid div{background:var(--soft);border-radius:9px;padding:10px 12px;min-width:0}

.today li.is-today{background:var(--grad-soft)}
dialog.wizard{max-height:94dvh}.wz{max-height:94dvh}
.btn.cal{gap:5px;color:var(--accent);border-color:rgba(59,130,246,.35);background:var(--card)}
.btn.cal svg{width:16px;height:16px}
.cal-menu{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.cal-tip{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--grad-soft);border:1px solid rgba(59,130,246,.3)}
.cal-tip > div{flex:1;min-width:180px}
.cal-tip b{display:block;font-size:.92rem}
.cal-tip span{font-size:.8rem;color:var(--muted)}
.mt li{flex-wrap:wrap}
:root[data-hide] :is(.kpi .val,.kpi .foot,.alt-cur,.sumgrid b,.amt,.owed,.jrem,.jmoney,.mgrid b,.pays .a,.pays .hint,.months b,.zk b,.rem-line b,.mv){filter:blur(7px);user-select:none;-webkit-user-select:none;cursor:pointer}
@media (prefers-reduced-motion:no-preference){:is(.kpi .val,.kpi .foot,.alt-cur,.sumgrid b,.amt,.owed,.jrem,.jmoney,.mgrid b,.pays .a,.pays .hint,.months b,.zk b,.rem-line b,.mv){transition:filter .2s}}
.today li.is-late{background:var(--bad-soft)}
.today li .btn.sm{flex:none}
.rem-line{font-size:.9rem;color:var(--muted);margin-top:-4px}
.rem-line b{color:var(--owed);font-weight:600}
/* v3: slim WhatsApp bar, labelled hide button, second currency */
.wa-bar{display:flex;align-items:center;gap:12px;width:100%;border:1px solid rgba(31,168,85,.25);background:linear-gradient(135deg,rgba(31,168,85,.12),rgba(6,182,212,.08)),var(--card);border-radius:12px;padding:10px 14px;color:var(--ink);text-align:start;font:inherit;cursor:pointer}
.wa-bar:hover{border-color:var(--wa)}
.wa-bar .ic{width:34px;height:34px;border-radius:9px;background:var(--wa);color:#fff;display:grid;place-items:center;flex:none}
.wa-bar .ic svg{width:20px;height:20px}
.wa-bar b{flex:1;font-weight:600}
.wa-bar .chev{width:18px;height:18px;color:var(--muted)}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:-6px}
.sec-h h2{font-size:1.05rem;font-weight:600;margin-inline-end:auto}
.eye-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:.86rem;font-weight:500;cursor:pointer}
.eye-pill svg{width:18px;height:18px}
.eye-pill[aria-pressed="true"]{background:var(--grad-soft);border-color:#3B82F6}
.alt-cur{display:block;font-size:.8rem;font-family:var(--f-body);font-weight:500;color:var(--muted);margin-top:2px}
.kpis .kpi:first-child .alt-cur{color:rgba(255,255,255,.85)}
.sumgrid .alt-cur{font-size:.72rem}
.owed{text-align:end}
.owed .alt-cur{font-size:.72rem}
/* ---------- modern gradient layer ---------- */
:root{
  --grad:linear-gradient(135deg,#06B6D4 0%,#3B82F6 55%,#7C3AED 100%);
  --grad-soft:linear-gradient(135deg,rgba(6,182,212,.14),rgba(124,58,237,.14));
  --grad-side:radial-gradient(120% 60% at 100% 0%,rgba(59,130,246,.28),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(124,58,237,.30),transparent 65%),linear-gradient(180deg,#0B1424 0%,#0E1730 100%);
  --glow:0 8px 24px rgba(59,130,246,.30);
}
.side{background:var(--grad-side)}
.mbar{background:var(--grad-side)!important}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.08);border-color:transparent}
.tabbar .add{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(124,58,237,.10),rgba(6,182,212,.22));box-shadow:inset -3px 0 0 #22D3EE}
.side .wa{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.kpis .kpi:first-child{background:var(--grad);border:0;color:#fff;box-shadow:var(--glow);position:relative;overflow:hidden}
.kpis .kpi:first-child::after{content:"";position:absolute;inset:-40% -20% auto auto;width:70%;height:140%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 60%);pointer-events:none}
.kpis .kpi:first-child .lbl,.kpis .kpi:first-child .foot,.kpis .kpi:first-child .val small,.kpis .kpi:first-child .val .alt{color:rgba(255,255,255,.85)}
.kpis .kpi:first-child .lbl i{background:#fff!important}
.meter i,.months .barw i{background:var(--grad)}
.meter.full i{background:linear-gradient(90deg,#10B981,#22D3EE)}
.pick[aria-pressed="true"]{background:var(--grad-soft);border-color:#3B82F6}
.seg button[aria-pressed="true"]{background:var(--grad-soft)}
.wa-card{background:linear-gradient(135deg,rgba(31,168,85,.10),rgba(6,182,212,.08)),var(--card)}
.avatar{background:var(--grad-soft)}
.topbar h1{background:linear-gradient(90deg,var(--ink),#3B82F6);-webkit-background-clip:text;background-clip:text;color:transparent}
.datebox{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;border:1px solid transparent}
.datebox.late{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#F43F5E,#F59E0B) border-box}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topbar h1{background:linear-gradient(90deg,#E7EDF3,#67E8F9)}}
:root[data-theme="dark"] .topbar h1{background:linear-gradient(90deg,#E7EDF3,#67E8F9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topbar h1,:root[data-theme="dark"] .topbar h1{-webkit-background-clip:text;background-clip:text;color:transparent}}
</style>

<div id="splash" role="dialog" aria-label="بسم الله">
  <svg><use href="#i-reg"/></svg>
  <div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  <div class="dua" id="spDua"></div>
  <div class="src" id="spSrc"></div>
  <div class="bar"><i></i></div>
</div>
<script>
(function(){var D=[["بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ","رواه أبو داود والترمذي"],
["اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا","رواه ابن ماجه"],
["اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ","رواه الترمذي"],
["﴿رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي﴾","سورة طه: 25-26"],
["﴿حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ﴾","سورة التوبة: 129"]];
var i=Math.floor(Date.now()/864e5)%D.length;document.getElementById("spDua").textContent=D[i][0];document.getElementById("spSrc").textContent=D[i][1];})();
</script>

<!-- Add / edit -->
<dialog class="wizard" id="wizDlg" aria-labelledby="wzTitle">
  <form class="wz" id="wzForm" novalidate>
    <div class="wz-h" style="padding-bottom:4px">
      <div class="row"><h2 id="wzTitle">مشروع جديد</h2><button class="btn primary sm" type="submit" id="wzSaveTop">حفظ</button><button class="btn ghost sm" type="button" id="wzClose" aria-label="إغلاق"><svg><use href="#i-x"/></svg></button></div>
    </div>
    <div class="wz-b">
      <div id="clientPicks"></div>
      <div class="fgrid">
        <label class="f" id="lClient"><span>اسم العميل <span class="req">*</span></span><input id="fClient" autocomplete="off" placeholder="اسم الشخص أو الشركة"></label>
        <label class="f">رقم واتساب<input id="fPhone" type="tel" dir="ltr" autocomplete="off" placeholder="01xxxxxxxxx"></label>
        <label class="f full" id="lTitle"><span>اسم المشروع <span class="req">*</span></span><input id="fTitle" autocomplete="off" placeholder="مثلاً: لوجو لكافيه"></label>
        <div class="full"><span class="flabel">العملة</span><div class="picks" id="curPicks"></div></div>
        <label class="f money-in" id="lPrice"><span>السعر <span class="req">*</span></span><input id="fPrice" type="number" min="0" step="any" inputmode="decimal" placeholder="0"><em class="cur"></em></label>
        <label class="f money-in" id="lDeposit">العربون المدفوع<input id="fDeposit" type="number" min="0" step="any" inputmode="decimal" placeholder="0"><em class="cur"></em></label>
        <div class="full picks" id="depRecv" hidden></div>
        <div class="full rem-line" id="remLine" hidden></div>
        <label class="f full" id="lRate" hidden><span id="lRateT">سعر الصرف</span><input id="fRate" type="number" min="0" step="any" inputmode="decimal" placeholder="يُحدَّث تلقائياً عند الاتصال"><span class="hint">يُحتسب العربون بهذا السعر.</span></label>
      </div>
      <div class="days-row" id="daysRow">
        <label class="f">مدة التسليم (أيام)<input id="fDays" type="number" min="0" step="1" inputmode="numeric" placeholder="مثلاً 8"></label>
        <label class="f">موعد التسليم للعميل<input id="fDue" type="date"></label>
      </div>
      <div class="fgrid" id="startRow">
        <label class="f">تاريخ البدء<input id="fStart" type="date"></label>
        <label class="f">موعد الإنجاز الداخلي<input id="fFinish" type="date"></label>
      </div>
      <div>
        <div class="ph-sum" id="phSum" hidden></div>
        <div class="phases" id="phases"></div>
        <button class="btn ghost sm" type="button" id="addPhase" style="color:var(--accent);padding-inline:0;margin-top:4px"><svg><use href="#i-plus"/></svg>تقسيم التسليم على مراحل</button>
      </div>
      <div><span class="flabel">نوع المشروع</span><div class="picks" id="typePicks"></div></div>
      <details class="more" id="more">
        <summary>تفاصيل إضافية (اختياري)</summary>
        <div class="fgrid" style="margin-top:12px">
          <label class="f">عدد التعديلات<input id="fRevs" type="number" min="0" step="1" inputmode="numeric" placeholder="مثلاً 2"></label>
          <label class="f full">ملاحظات البريف<textarea id="fNotes" placeholder="الألوان، المقاسات، الملفات المطلوبة…"></textarea></label>
        </div>
      </details>
    </div>
    <div class="wz-f">
      <button class="btn primary" type="submit" id="wzSave">حفظ المشروع</button>
      <button class="btn" type="button" id="wzCancel">إلغاء</button>
    </div>
  </form>
</dialog>

<dialog class="wizard" id="expDlg" aria-labelledby="exTitle">
